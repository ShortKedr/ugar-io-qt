name: Build Desktop Binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\ugar-io-qt | Out-Null
          Copy-Item build\Release\ugar-io-qt.exe dist\ugar-io-qt\ -ErrorAction SilentlyContinue
          if (-not (Test-Path dist\ugar-io-qt\ugar-io-qt.exe)) {
            Copy-Item build\ugar-io-qt.exe dist\ugar-io-qt\
          }
          Copy-Item resources\qt.conf dist\ugar-io-qt\
          windeployqt --release --dir dist\ugar-io-qt dist\ugar-io-qt\ugar-io-qt.exe
          Compress-Archive -Path dist\ugar-io-qt\* -DestinationPath dist\ugar-io-qt-windows.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-windows
          path: dist/ugar-io-qt-windows.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libx11-xcb1 libfontconfig1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Bundle Linux app
        run: |
          mkdir -p dist/AppDir/usr/bin dist/AppDir/usr/share/applications dist/AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/ugar-io-qt dist/AppDir/usr/bin/
          cp resources/qt.conf dist/AppDir/usr/bin/
          cp resources/icon.ico dist/AppDir/usr/share/icons/hicolor/256x256/apps/ugar-io-qt.ico
          cat > dist/AppDir/usr/share/applications/ugar-io-qt.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Ugar.io Qt
          Exec=ugar-io-qt
          Icon=ugar-io-qt
          Categories=Game;
          EOF
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O linuxdeployqt.AppImage
          chmod +x linuxdeployqt.AppImage
          ./linuxdeployqt.AppImage dist/AppDir/usr/share/applications/ugar-io-qt.desktop -bundle-non-qt-libs -unsupported-allow-new-glibc
          tar -C dist -czf dist/ugar-io-qt-linux.tar.gz AppDir

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-linux
          path: dist/ugar-io-qt-linux.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Deploy macOS bundle
        run: |
          mkdir -p dist
          cp resources/qt.conf build/ugar-io-qt.app/Contents/Resources/qt.conf
          macdeployqt build/ugar-io-qt.app
          tar -C build -czf dist/ugar-io-qt-macos.tar.gz ugar-io-qt.app

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-macos
          path: dist/ugar-io-qt-macos.tar.gz
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ugar-io-qt-windows.zip
            release-assets/ugar-io-qt-linux.tar.gz
            release-assets/ugar-io-qt-macos.tar.gz
          generate_release_notes: true
