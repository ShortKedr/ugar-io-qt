name: Build Desktop Binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\ugar-io-qt | Out-Null
          Copy-Item build\Release\ugar-io-qt.exe dist\ugar-io-qt\ -ErrorAction SilentlyContinue
          if (-not (Test-Path dist\ugar-io-qt\ugar-io-qt.exe)) {
            Copy-Item build\ugar-io-qt.exe dist\ugar-io-qt\
          }
          Copy-Item resources\qt.conf dist\ugar-io-qt\
          windeployqt --release --dir dist\ugar-io-qt dist\ugar-io-qt\ugar-io-qt.exe
          Compress-Archive -Path dist\ugar-io-qt\* -DestinationPath dist\ugar-io-qt-windows.zip

      - name: Smoke test Windows package
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\ugar-io-qt\ugar-io-qt.exe" -ArgumentList "--smoke-test" -PassThru -NoNewWindow
          try {
            Wait-Process -Id $process.Id -Timeout 15 -ErrorAction Stop
          } catch {
            if (Get-Process -Id $process.Id -ErrorAction SilentlyContinue) {
              Stop-Process -Id $process.Id -Force
            }
            throw "Windows smoke test timed out"
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            throw "Windows smoke test failed with exit code $($process.ExitCode)"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-windows
          path: dist/ugar-io-qt-windows.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build imagemagick patchelf desktop-file-utils appstream xvfb libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libx11-xcb1 libfontconfig1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Bundle Linux app
        run: |
          mkdir -p dist/AppDir/usr/share/icons/hicolor/256x256/apps
          cmake --install build --prefix "$PWD/dist/AppDir/usr" --config Release
          convert "resources/icon.ico[0]" -resize 256x256 dist/AppDir/usr/share/icons/hicolor/256x256/apps/ugar-io-qt.png
          cp dist/AppDir/usr/share/applications/ugar-io-qt.desktop dist/AppDir/ugar-io-qt.desktop
          cp dist/AppDir/usr/share/icons/hicolor/256x256/apps/ugar-io-qt.png dist/AppDir/ugar-io-qt.png
          ln -sf usr/bin/ugar-io-qt dist/AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O dist/appimagetool.AppImage
          chmod +x dist/appimagetool.AppImage
          find dist/AppDir -maxdepth 4 -type f | sort
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./dist/appimagetool.AppImage dist/AppDir dist/ugar-io-qt-linux-x86_64.AppImage

      - name: Smoke test Linux package
        run: APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a python3 -c "import subprocess; subprocess.run(['dist/ugar-io-qt-linux-x86_64.AppImage', '--smoke-test'], check=True, timeout=15)"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-linux
          path: dist/ugar-io-qt-linux-x86_64.AppImage
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Deploy macOS bundle
        run: |
          mkdir -p dist
          cmake --install build --prefix "$PWD/dist" --config Release
          APP_BUNDLE="$(find dist -maxdepth 2 -type d -name 'ugar-io-qt.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "Failed to locate ugar-io-qt.app after the macOS build"
            exit 1
          fi
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" dist/ugar-io-qt-macos.zip

      - name: Smoke test macOS package
        run: python3 -c "import subprocess; subprocess.run(['dist/ugar-io-qt.app/Contents/MacOS/ugar-io-qt', '--smoke-test'], check=True, timeout=15)"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-macos
          path: dist/ugar-io-qt-macos.zip
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ugar-io-qt-windows.zip
            release-assets/ugar-io-qt-linux-x86_64.AppImage
            release-assets/ugar-io-qt-macos.zip
          generate_release_notes: true
