name: Build Desktop Binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\ugar-io-qt | Out-Null
          Copy-Item build\Release\ugar-io-qt.exe dist\ugar-io-qt\ -ErrorAction SilentlyContinue
          if (-not (Test-Path dist\ugar-io-qt\ugar-io-qt.exe)) {
            Copy-Item build\ugar-io-qt.exe dist\ugar-io-qt\
          }
          Copy-Item resources\qt.conf dist\ugar-io-qt\
          windeployqt --release --dir dist\ugar-io-qt dist\ugar-io-qt\ugar-io-qt.exe
          Compress-Archive -Path dist\ugar-io-qt\* -DestinationPath dist\ugar-io-qt-windows.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-windows
          path: dist/ugar-io-qt-windows.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build imagemagick patchelf desktop-file-utils appstream libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libx11-xcb1 libfontconfig1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Bundle Linux app
        run: |
          mkdir -p dist/AppDir/usr/share/icons/hicolor/256x256/apps
          DESTDIR="$PWD/dist/AppDir" cmake --install build --prefix /usr --config Release
          convert "resources/icon.ico[0]" -resize 256x256 dist/AppDir/usr/share/icons/hicolor/256x256/apps/ugar-io-qt.png
          cp dist/AppDir/usr/share/applications/ugar-io-qt.desktop dist/AppDir/ugar-io-qt.desktop
          cp dist/AppDir/usr/share/icons/hicolor/256x256/apps/ugar-io-qt.png dist/AppDir/ugar-io-qt.png
          find dist/AppDir -maxdepth 4 -type f | sort
          qmake -v
          ldd dist/AppDir/usr/bin/ugar-io-qt
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O linuxdeployqt.AppImage
          chmod +x linuxdeployqt.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeployqt.AppImage dist/AppDir/usr/share/applications/ugar-io-qt.desktop -qmake="$(command -v qmake)" -bundle-non-qt-libs -unsupported-allow-new-glibc -verbose=3
          tar -C dist -czf dist/ugar-io-qt-linux.tar.gz AppDir

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-linux
          path: dist/ugar-io-qt-linux.tar.gz
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          cache: true

      - name: Configure CMake
        run: qt-cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build executable
        run: cmake --build build --config Release --target ugar-io-qt

      - name: Deploy macOS bundle
        run: |
          mkdir -p dist
          APP_BUNDLE="$(find build -maxdepth 4 -type d -name 'ugar-io-qt.app' -print -quit)"
          if [ -z "$APP_BUNDLE" ]; then
            echo "Failed to locate ugar-io-qt.app after the macOS build"
            exit 1
          fi
          mkdir -p "$APP_BUNDLE/Contents/Resources"
          cp resources/qt.conf "$APP_BUNDLE/Contents/Resources/qt.conf"
          macdeployqt "$APP_BUNDLE"
          codesign --force --deep --sign - "$APP_BUNDLE"
          codesign --verify --deep --strict --verbose=2 "$APP_BUNDLE"
          ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" dist/ugar-io-qt-macos.zip

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: ugar-io-qt-macos
          path: dist/ugar-io-qt-macos.zip
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ugar-io-qt-windows.zip
            release-assets/ugar-io-qt-linux.tar.gz
            release-assets/ugar-io-qt-macos.zip
          generate_release_notes: true
